[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "campus-energy-forecasting"
version = "0.1.0"
description = "Leakage-safe occupancy-aware probabilistic campus energy forecasting research platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Campus Energy Forecasting Research Team" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
research = [
  "torch>=2.2,<3",
  "lightgbm>=4.3,<5",
  "shap>=0.45,<1",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
campus-api = "campus_forecast.api.main:run"
campus-audit = "campus_forecast.cli:audit"
campus-demo = "campus_forecast.cli:demo"

[tool.hatch.build.targets.wheel]
packages = ["src/campus_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
